urutan: 3
judul: Sistem Langitan v2 — Penulisan Ulang SIAKAD di Atas Basis Data Warisan
tahun: 2026
ringkas: Penulisan ulang sistem informasi akademik Langitan ke Laravel 12, Inertia, dan Vue 3 — dikerjakan
  di atas basis data Oracle warisan yang tidak boleh diubah karena masih melayani sistem lama di produksi.
lead: Menulis ulang sistem yang tidak boleh berhenti sehari pun. Basis datanya masih dipakai versi lama
  yang berjalan di produksi, jadi skema warisannya tidak bisa disentuh — dan versi lama itu pula yang
  menjadi acuan benar-salahnya setiap layar baru.
peran: Pengembang Utama
periode: Feb 2025 — Sekarang
tim: 5 kontributor
tipe: Sistem internal kampus
tags:
- Laravel 12
- Inertia
- Vue 3
- Oracle
- JWT
- Pest
live: null
status: Dalam pengembangan — berdampingan dengan versi lama
fitur:
- Dua permukaan setara dari satu lapisan layanan — halaman web Inertia dan API JSON berversi, tanpa
  logika yang digandakan
- Empat belas peran pengguna dengan berkas rute dan kewenangan terpisah, dari mahasiswa dan dosen
  sampai keuangan, penjaminan mutu, dan rektor
- Menu sidebar dan remah roti dirender dari tabel menu warisan, bukan dipaku di kode
- Autentikasi ganda — sesi untuk web, token JWT untuk klien mobile yang sudah berjalan
- Pemberitahuan langsung lewat Laravel Reverb
- Keputusan arsitektur direkam sebagai ADR dan ditegakkan oleh berkas uji, termasuk penamaan rute
  yang pelanggarannya tidak memunculkan galat apa pun
metrik:
- angka: '170'
  keterangan: Commit atas nama saya di repositori ini
- angka: '14'
  keterangan: Peran pengguna dengan rute dan kewenangan terpisah
- angka: '106'
  keterangan: Model yang memetakan skema Oracle warisan
diagram:
  file: sistem-langitan-v2.svg
  keterangan: Dua permukaan setara — halaman web dan klien mobile — menyatu ke satu lapisan layanan,
    lalu bertumpu pada basis data warisan. Yang bertanda hijau adalah basis datanya, bukan lapisan
    layanannya, karena di situlah kendalanya. Kotak putus-putus di kanan adalah sistem lama yang masih
    melayani produksi di atas basis data yang sama, dan karena itu skemanya tidak bisa disentuh.
gambar:
- file: sistem-langitan-v2-1.jpg
  keterangan: Pusat unduhan formulir — dokumen resmi akademik dikelompokkan per keperluan, dari cuti
    kuliah sampai bebas administrasi.
- file: sistem-langitan-v2-2.jpg
  keterangan: Jadwal kuliah per hari, lengkap dengan kode mata kuliah, bobot SKS, dan ruangnya.
- file: sistem-langitan-v2-3.jpg
  keterangan: Riwayat nilai dan performa akademik per semester. Tanpa nama maupun nomor induk, jadi
    tidak menunjuk mahasiswa tertentu.
tantangan:
- '[ISI] Bagian tersulit dari mencocokkan perilaku v2 dengan v1 memakai data asli. Contoh yang paling
  membekas?'
- '[ISI] Adakah keputusan arsitektur yang kemudian kamu ubah setelah dipakai beberapa modul?'
belajar: '[ISI] Satu pelajaran dari menulis ulang sistem yang basis datanya tidak boleh disentuh —
  sesuatu yang akan kamu bawa ke proyek migrasi berikutnya.'
kerahasiaan: sivitas akademika
