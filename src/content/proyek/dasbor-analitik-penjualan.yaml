urutan: 1
judul: Dasbor Analitik Penjualan
tahun: 2026
ringkas: Dasbor internal untuk memantau penjualan harian dengan grafik interaktif, filter periode, dan
  ekspor laporan.
lead: Mengubah laporan penjualan yang tersebar di puluhan file spreadsheet menjadi satu dasbor yang bisa
  dibuka siapa saja, kapan saja, dan selalu terbarui.
peran: Frontend Developer
periode: Jan — Apr 2026
tim: 4 orang
tipe: Produk internal
tags:
- React
- Chart.js
- Node.js
- PostgreSQL
live: null
status: Produksi — sistem internal
masalah:
- Tim penjualan menyusun laporan harian secara manual di spreadsheet. Setiap pagi, seorang staf menghabiskan
  hampir dua jam menyalin data dari tiga sistem berbeda sebelum bisa mengirim rekap ke manajemen.
- Akibatnya, keputusan sering diambil berdasarkan angka kemarin — bukan angka hari ini. Ketika ada anomali
  penjualan, tim baru menyadarinya beberapa hari kemudian.
- <strong>Pertanyaan intinya:</strong> bagaimana caranya membuat angka penjualan bisa dilihat siapa pun
  dalam hitungan detik, tanpa perlu ada yang menyalin data secara manual?
solusi:
- Saya membangun dasbor web yang menarik data langsung dari basis data penjualan dan menyajikannya dalam
  bentuk grafik yang bisa difilter. Tidak ada lagi proses salin-tempel.
- 'Fokus desainnya bukan menampilkan sebanyak mungkin angka, melainkan menjawab tiga pertanyaan yang paling
  sering ditanyakan manajemen: berapa penjualan hari ini, bagaimana dibanding periode sebelumnya, dan
  produk mana yang bergerak.'
proses:
- <strong>Riset pengguna.</strong> Mewawancarai lima orang dari tim penjualan dan dua manajer untuk memahami
  angka apa yang benar-benar mereka pakai.
- <strong>Pemetaan data.</strong> Merancang skema dan endpoint agregasi bersama tim backend agar perhitungan
  berat dilakukan di server, bukan di browser.
- <strong>Purwarupa.</strong> Membuat versi kasar dengan data statis untuk diuji ke pengguna sebelum menulis
  kode integrasi.
- '<strong>Pengembangan bertahap.</strong> Merilis per modul: ringkasan, grafik tren, tabel rinci, lalu
  ekspor.'
- <strong>Optimasi.</strong> Mengukur performa rendering dan memperbaiki bagian yang paling lambat.
fitur:
- Ringkasan harian dengan pembanding otomatis terhadap periode sebelumnya
- Grafik tren interaktif dengan rentang waktu yang bisa diatur bebas
- 'Filter berlapis: cabang, kategori produk, dan tenaga penjual'
- Ekspor laporan ke format CSV dan PDF sekali klik
- Pembaruan data otomatis setiap lima menit tanpa perlu memuat ulang halaman
metrik:
- angka: 40%
  keterangan: Waktu muat halaman lebih cepat setelah optimasi
- angka: ~2 jam
  keterangan: Pekerjaan manual yang hilang setiap hari
- angka: 12 → 1
  keterangan: Jumlah file laporan yang harus dibuka
gambar:
- file: dasbor-analitik-penjualan-1.png
  keterangan: Halaman ringkasan dengan angka penjualan harian dan pembanding periode sebelumnya.
- file: dasbor-analitik-penjualan-2.png
  keterangan: Grafik tren yang bisa difilter per cabang dan kategori produk.
- file: dasbor-analitik-penjualan-3.png
  keterangan: Tabel rinci dengan opsi ekspor laporan.
tantangan:
- Tantangan terbesar ada di performa. Versi pertama menggambar ulang seluruh grafik setiap kali filter
  berubah, dan pada data satu tahun penuh browser terasa tersendat.
- 'Solusinya dua lapis: memindahkan agregasi ke sisi server sehingga browser hanya menerima data yang
  sudah diringkas, lalu menerapkan memoisasi pada komponen grafik agar hanya bagian yang berubah yang
  dirender ulang. Waktu muat turun dari sekitar 3 detik menjadi 1,8 detik.'
belajar: 'Saya belajar bahwa masalah performa hampir selalu masalah arsitektur data, bukan masalah pemilihan
  pustaka. Sebelum mengganti library grafik, saya harusnya lebih dulu bertanya: apakah browser memang
  perlu menerima data sebanyak ini?'
kerahasiaan: perusahaan
