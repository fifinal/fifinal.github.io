urutan: 2
judul: Sistem Langitan — Sistem Informasi Akademik Multi-Kampus
tahun: 2026
ringkas: Sistem informasi akademik multi-tenant yang melayani beberapa perguruan tinggi sekaligus dari
  satu basis kode, mencakup lima puluh modul dari pendaftaran mahasiswa baru sampai wisuda.
lead: Satu basis kode yang harus melayani beberapa kampus sekaligus — masing-masing dengan identitas,
  aturan akademik, dan datanya sendiri — sambil terus berjalan tanpa boleh berhenti sehari pun.
peran: Pengembang Utama
periode: 2022 — Sekarang
tim: 12 kontributor
tipe: Sistem internal kampus
tags:
- PHP 8.1
- Oracle
- Smarty
- Docker
- Legacy
live: null
status: Produksi — sistem internal
masalah:
- '[ISI] Dalam keadaan seperti apa sistem ini ketika kamu mulai menanganinya pada 2022?'
- '[ISI] Kenapa migrasi ke PHP 8 jadi mendesak? Apa yang terancam kalau ditunda?'
- '[ISI] Apa kesulitan khas merawat satu basis kode yang dipakai beberapa kampus dengan aturan berbeda?'
- '[ISI] Apa risiko terbesar mengubah sistem yang dipakai seluruh kampus setiap hari?'
solusi:
- '[ISI] Bagaimana strategi migrasinya — bertahap per modul, atau sekaligus?'
- '[ISI] Kenapa memilih menambahkan pemeriksa kompatibilitas otomatis ketimbang memeriksa manual?'
- '[ISI] Bagaimana perbedaan antar kampus ditangani tanpa menggandakan kode?'
proses:
- '[ISI] Bagaimana kamu memetakan bagian mana saja yang akan rusak di PHP 8?'
- '[ISI] Bagaimana pengujian dilakukan sebelum perubahan naik ke produksi?'
- '[ISI] Bagaimana kamu menangani modul yang terlalu berisiko diubah?'
fitur:
- Satu basis kode melayani beberapa perguruan tinggi sekaligus, dengan tampilan dan identitas terpisah
  untuk tiap institusi
- Lima puluh modul akademik yang saling terhubung — pendaftaran mahasiswa baru, perkuliahan, keuangan,
  kepegawaian, hingga wisuda
- Empat jenis pengguna — pegawai, dosen, mahasiswa, dan orang tua — dengan lebih dari tiga puluh peran
  turunan
- Kewenangan tiap peran ditentukan lewat pemetaan modul dan menu di basis data, bukan dipaku di kode
- Navigasi ala aplikasi satu halaman memakai hash router, dibangun di atas basis kode lawas
- Migrasi bertahap ke PHP 8.1 disertai perkakas pemeriksa kompatibilitas yang bisa dijalankan berulang
  sebelum tiap rilis
- Analisis statis dengan PHPStan dan pemeriksaan gaya kode otomatis
- Pelaporan data akademik ke PDDikti, serta pembuatan dokumen cetak dan berkas lembar sebar
- Lingkungan terkontainer Docker multi-tahap dengan rilis otomatis lewat GitHub Actions
