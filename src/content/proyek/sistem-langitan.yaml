tantangan:
- 'Yang paling sulit disentuh punya ciri yang sama: berkasnya raksasa dan tidak memisahkan apa pun —
  tampilan, logika, dan akses data berada dalam satu tempat — sementara sebagian aturannya justru tinggal
  di dalam kueri Oracle yang panjang, bukan di kode PHP-nya. Tidak ada garis yang aman untuk memotong.'
- Dua modul menonjol di antaranya. Keuangan dan tagihan hampir tidak punya ruang coba-coba karena salahnya
  berurusan dengan uang, dan perhitungan nilai serta KRS menyimpan aturan akademik yang menumpuk
  bertahun-tahun — sebagian tidak pernah tertulis di mana pun, hanya hidup di dalam kodenya.
- 'Pernah, dan cara ketahuannya persis seperti yang dikhawatirkan tadi — dari laporan pengguna, bukan
  dari pemeriksaan sendiri. Itulah harga tidak punya jaring pengaman otomatis: perubahan yang terlihat
  aman baru terbukti tidak aman setelah dipakai orang lain.'
belajar: Yang berubah adalah untuk siapa saya menulis. Merawat kode orang lain selama bertahun-tahun
  membuat saya berhenti mengejar kode yang pintar dan mulai menulis untuk pembaca berikutnya — yang bisa
  jadi saya sendiri tiga tahun lagi, tanpa ingatan apa pun tentang kenapa baris ini ada. Kode yang mudah
  dibaca lebih berharga daripada kode yang mengesankan.
