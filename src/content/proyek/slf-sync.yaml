urutan: 4
judul: SLF Sync — Penghubung Sistem Akademik dengan Pangkalan Data Nasional
tahun: 2026
ringkas: Alat sinkronisasi yang mengirim data akademik dari Sistem Langitan ke Feeder PDDikti — pelaporan
  wajib yang menentukan status data seluruh mahasiswa di pangkalan data nasional.
lead: Alat kecil yang taruhannya besar. Kalau ia mengirim data yang salah, yang keliru bukan satu layar
  di kampus, melainkan catatan resmi mahasiswa di pangkalan data nasional.
peran: Pengembang Utama
periode: 2022 — Sekarang
tim: 2 orang
tipe: Sistem internal kampus
tags:
- CodeIgniter
- SOAP
- Smarty
- PDDikti
- Docker
live: null
status: Produksi — sistem internal
fitur:
- Sinkronisasi data akademik dari sistem kampus ke Feeder PDDikti lewat layanan web
- Pembatalan hasil sinkronisasi ketika data yang terkirim ternyata keliru
- Penghapusan dan penautan data sebagai jalur terpisah dari sinkronisasi biasa
- Dua generasi mekanisme sinkronisasi berjalan berdampingan, yang lama tidak dimatikan begitu saja
- Antarmuka pemantauan untuk melihat apa yang sudah dan belum terkirim
- Berjalan dalam kontainer Docker
metrik:
- angka: '93'
  keterangan: Commit atas nama saya, dijumlahkan dari dua akun
- angka: 4 tahun
  keterangan: Dirawat tanpa putus sejak 2022
- angka: '2'
  keterangan: Orang yang merawat seluruh sistem ini
diagram:
  file: slf-sync.svg
  keterangan: Data akademik mengalir satu arah dari sistem kampus ke pangkalan data nasional. Yang
    bertanda hijau adalah jalur pembatalan — jalan pulang untuk menarik kembali kiriman yang keliru,
    karena kesalahan di pangkalan data nasional tidak bisa sekadar ditimpa. Kotak putus-putus di kanan
    berada di luar kendali kami.
gambar:
- file: slf-sync-1.png
  keterangan: Sinkronisasi nilai perkuliahan ke Feeder — 212 data dibandingkan satu per satu antara
    sistem kampus dan pangkalan data nasional, seluruhnya cocok. Kolom nomor induk disensor.
- file: slf-sync-2.png
  keterangan: Sinkronisasi aktivitas perkuliahan, membandingkan IPK dan SKS di kedua sistem sekaligus.
    Kolom identitas disensor.
tantangan:
- 'Pernah terjadi data yang terkirim ternyata keliru. Yang menarik: ketahuannya bukan dari pesan galat —
  Feeder menjawab berhasil — melainkan dari <strong>selisih jumlah data</strong> antara sistem kampus dan
  pangkalan data nasional ketika keduanya dibandingkan. Dari situ baru ditelusuri baris mana yang
  menyimpang.'
- Karena itu jalur pembatalan bukan fitur tambahan, melainkan syarat. Sistem yang menulis ke pangkalan
  data pihak lain harus punya cara menarik kembali kirimannya — di sana kesalahan tidak bisa sekadar
  ditimpa dengan data yang benar.
belajar: 'Pelajaran yang paling terpakai di tempat lain: jangan percaya status "berhasil" dari sistem
  yang bukan milik kita. Balasan sukses hanya berarti kirimannya diterima, bukan berarti datanya sama.
  Yang menjamin kesamaan cuma satu — membandingkan kembali kedua sisi setelah kirim.'
