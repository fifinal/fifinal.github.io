tantangan:
- Bagian tersulit justru bukan teknis, melainkan menahan diri. Saya sempat ingin menambahkan banyak fitur
  karena secara teknis menarik dikerjakan.
- 'Setelah melihat klien kebingungan pada versi awal panel admin yang terlalu ramai, saya memangkas habis:
  menghapus tiga menu, menyatukan form, dan mengganti istilah teknis dengan bahasa sehari-hari. Versi
  yang lebih sedikit fiturnya justru jauh lebih terpakai.'
belajar: 'Fitur yang tidak dipakai sama nilainya dengan fitur yang tidak ada — bedanya, fitur yang tidak
  dipakai tetap harus dirawat. Sejak proyek ini saya selalu bertanya lebih dulu: kalau fitur ini dihapus,
  apa yang rusak?'
kerahasiaan: klien
