urutan: 3
judul: Aplikasi Catatan Kolaboratif
tahun: 2025
ringkas: Aplikasi catatan real-time di mana beberapa orang bisa menyunting dokumen yang sama sekaligus.
lead: 'Sebuah eksperimen teknis yang berubah jadi alat harian: menyunting dokumen bersama-sama, lengkap
  dengan riwayat versi dan mode offline.'
peran: Full-stack Developer
periode: Feb — Jun 2025
tim: 2 orang
tipe: Proyek sampingan
tags:
- React
- WebSocket
- Express
- IndexedDB
live: '#'
status: Situs Live
masalah:
- 'Saat mengerjakan proyek kelompok, catatan rapat kami selalu berakhir tercecer: satu versi di aplikasi
  pesan, satu di dokumen daring, satu lagi di catatan pribadi seseorang.'
- Alat kolaborasi yang ada sebenarnya bagus, tapi terasa berat dan menuntut koneksi stabil — sesuatu yang
  tidak selalu kami punya.
- <strong>Tantangan yang saya ambil:</strong> membangun editor bersama yang tetap bisa dipakai saat koneksi
  putus, lalu menyatukan perubahan begitu koneksi kembali.
solusi:
- Aplikasi menyimpan setiap perubahan sebagai operasi kecil, bukan sebagai keseluruhan dokumen. Operasi
  itu dikirim lewat WebSocket dan digabungkan di sisi penerima.
- Saat koneksi terputus, operasi disimpan sementara di penyimpanan lokal browser dan dikirim ulang secara
  berurutan begitu sambungan pulih — sehingga pengguna nyaris tidak merasakan bedanya.
proses:
- <strong>Membaca teori.</strong> Mempelajari pendekatan penyelesaian konflik pada penyuntingan bersama
  sebelum menulis satu baris kode.
- <strong>Purwarupa kecil.</strong> Membuat editor teks polos untuk dua pengguna sebagai uji konsep.
- <strong>Lapisan sinkronisasi.</strong> Membangun server WebSocket dengan antrean operasi per dokumen.
- <strong>Mode offline.</strong> Menambahkan penyimpanan lokal dan mekanisme kirim ulang.
- <strong>Uji kekacauan.</strong> Menguji dengan sengaja memutus koneksi di tengah pengetikan untuk memastikan
  tidak ada teks yang hilang.
fitur:
- Penyuntingan bersama secara real-time dengan penanda kursor tiap pengguna
- Mode offline penuh — tetap bisa menulis tanpa koneksi
- Riwayat versi dengan kemampuan mengembalikan dokumen ke titik sebelumnya
- Penataan catatan dengan folder dan pencarian teks
- Tautan berbagi dengan tingkat akses baca atau sunting
metrik:
- angka: < 120 ms
  keterangan: Jeda rata-rata sinkronisasi antar pengguna
- angka: 100%
  keterangan: Perubahan offline yang berhasil disatukan saat uji
- angka: '8'
  keterangan: Penyunting bersamaan pada uji beban
gambar:
- file: catatan-kolaboratif-1.png
  keterangan: Editor dengan penanda kursor dua pengguna yang menyunting bersamaan.
- file: catatan-kolaboratif-2.png
  keterangan: Riwayat versi dengan opsi mengembalikan dokumen.
- file: catatan-kolaboratif-3.png
  keterangan: Indikator mode offline saat koneksi terputus.
tantangan:
- Konflik penyuntingan adalah masalah yang jauh lebih rumit dari dugaan awal saya. Versi pertama memakai
  pendekatan "yang terakhir menang", dan hasilnya kacau — kalimat orang lain bisa hilang begitu saja.
- Saya menggantinya dengan model berbasis operasi yang mempertimbangkan urutan dan posisi setiap perubahan.
  Butuh waktu tiga minggu hanya untuk bagian ini, tapi setelah itu tidak ada lagi laporan teks hilang.
belajar: Proyek ini mengajarkan saya untuk memisahkan "berjalan" dari "benar". Versi pertama berjalan
  mulus di layar saya sendiri, dan baru terbukti salah saat dua orang mengetik bersamaan. Sejak itu saya
  selalu menguji pada kondisi terburuk, bukan kondisi ideal.
kerahasiaan: klien
