diagram:
  file: sistem-magang.svg
  keterangan: Perjalanan satu peserta dari pendaftaran sampai pelaporan, dengan peran yang berganti di
    tiap tahap. Tahap bertanda hijau adalah titik peserta menyeberang dari kampus ke industri — dua peran
    di sana digambar putus-putus karena berada di luar kampus dan di luar kendali sistem.
gambar:
- file: sistem-magang-1.png
  keterangan: Pendaftar dari berbagai perguruan tinggi beserta status persetujuan berjenjangnya —
    kepala program studi lebih dulu, lalu pimpinan. Kolom nama dan nomor induk disensor.
- file: sistem-magang-2.png
  keterangan: Laporan bulanan peserta selama magang berjalan, tiap bulan disetujui terpisah. Identitas
    dan isi laporannya disensor.
tantangan:
- Yang paling rumit ternyata bukan menampilkan data yang sama secara berbeda, melainkan menyusun urutan
  persetujuannya — siapa menyetujui setelah siapa, dan apa yang boleh berjalan sebelum persetujuan itu
  turun. Tampilan tinggal mengikuti; urutannya yang menentukan.
- Ada fitur yang sudah jadi lalu tidak terpakai karena kebijakan programnya berubah sebelum sempat
  dipakai. Itu risiko yang melekat pada sistem yang mengikuti program tahunan, bukan kesalahan
  rancangan.
belajar: Petakan alur persetujuannya dulu sebelum menulis kode. Di sistem dengan dua belas peran,
  urutan siapa menyetujui setelah siapa adalah rangkanya — kalau itu belum jelas, tiap perubahan kecil
  merembet ke banyak layar sekaligus, dan yang tampak sebagai pekerjaan tampilan sebenarnya pekerjaan
  alur.
