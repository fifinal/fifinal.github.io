urutan: 1
judul: Simbelmawa — Pengelolaan Hibah PKM Nasional
tahun: 2026
ringkas: API inti sistem pengelolaan hibah dan program kemahasiswaan Kementerian Pendidikan Tinggi, Sains,
  dan Teknologi, melayani delapan jenis pengguna dari mahasiswa hingga pengelola kementerian.
lead: Satu sistem yang harus melayani mahasiswa pengusul, dosen pendamping, reviewer, operator kampus,
  dan pengelola kementerian sekaligus — masing-masing dengan pandangan dan kewenangan yang berbeda.
peran: Pengembang Utama — Backend
periode: 2023 — Sekarang
tim: 5 kontributor
tipe: Tim IT · Kementerian
tags:
- Laravel
- PHP
- PostgreSQL
- JWT
- Docker
live: https://simbelmawa.kemdiktisaintek.go.id/pkm
status: Produksi — sistem nasional
kontribusi:
- Merancang dan mengembangkan API-nya sebagai pengembang utama sisi backend — 1.265 commit atas nama
  saya di repositori inti.
- Memisahkan kewenangan delapan jenis pengguna, masing-masing dengan berkas rutenya sendiri, sehingga
  data yang sama tampil berbeda tergantung siapa yang memintanya.
- Menyiapkan autentikasi berbasis token JWT dengan masa berlaku terkendali.
- Menyambungkan sistem ke Pangkalan Data Pendidikan Tinggi (PDDikti) untuk verifikasi data mahasiswa
  dan institusi.
- 'Menelusuri dan mengoptimasi sisi aplikasi saat lonjakan menjelang tenggat — kueri berat, pemanggilan
  berulang, pemenggalan halaman, indeks — lalu menyerahkan sisanya ke tim DevOps ketika macetnya sudah
  berada di ranah infrastruktur.'
fitur:
- Pengelolaan program kemahasiswaan dan hibah, dari pengusulan hingga penetapan penerima
- Delapan peran pengguna dengan rute dan kewenangan terpisah — mahasiswa, dosen, reviewer, operator
  perguruan tinggi, pimpinan perguruan tinggi, pengelola LLDIKTI, admin kementerian, dan panitia PIMNAS
- Terhubung dengan Pangkalan Data Pendidikan Tinggi (PDDikti) untuk verifikasi data mahasiswa dan
  institusi
- Penugasan dan penilaian proposal oleh reviewer
- Basis pengetahuan berjenjang untuk pertanyaan yang sering diajukan, disusun per kategori dan tahapan
- Autentikasi berbasis token JWT dengan masa berlaku terkendali
- Berjalan dalam kontainer Docker dengan alur integrasi berkelanjutan
metrik:
