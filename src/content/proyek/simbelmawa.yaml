urutan: 1
judul: Simbelmawa — Pengelolaan Hibah PKM Nasional
tahun: 2026
ringkas: API inti sistem pengelolaan hibah dan program kemahasiswaan Kementerian Pendidikan Tinggi, Sains,
  dan Teknologi, melayani delapan jenis pengguna dari mahasiswa hingga pengelola kementerian.
lead: Satu sistem yang harus melayani mahasiswa pengusul, dosen pendamping, reviewer, operator kampus,
  dan pengelola kementerian sekaligus — masing-masing dengan pandangan dan kewenangan yang berbeda.
peran: Pengembang Utama — Backend
periode: 2023 — Sekarang
tim: 5 kontributor
tipe: Freelance · Kementerian
tags:
- Laravel
- PHP
- PostgreSQL
- JWT
- Docker
live: https://simbelmawa.kemdiktisaintek.go.id/
status: Produksi — sistem nasional
fitur:
- Pengelolaan program kemahasiswaan dan hibah, dari pengusulan hingga penetapan penerima
- Delapan peran pengguna dengan rute dan kewenangan terpisah — mahasiswa, dosen, reviewer, operator
  perguruan tinggi, pimpinan perguruan tinggi, pengelola LLDIKTI, admin kementerian, dan panitia PIMNAS
- Terhubung dengan Pangkalan Data Perguruan Tinggi untuk verifikasi data mahasiswa dan institusi
- Penugasan dan penilaian proposal oleh reviewer
- Basis pengetahuan berjenjang untuk pertanyaan yang sering diajukan, disusun per kategori dan tahapan
- Autentikasi berbasis token JWT dengan masa berlaku terkendali
- Berjalan dalam kontainer Docker dengan alur integrasi berkelanjutan
metrik:
- angka: '1.265'
  keterangan: Commit atas nama saya di repositori inti
- angka: '8'
  keterangan: Jenis pengguna dengan kewenangan berbeda
- angka: 3 tahun
  keterangan: Dikembangkan dan dirawat tanpa putus
diagram:
  file: simbelmawa.svg
  keterangan: Delapan peran pengguna mengerucut ke satu API. Lapisan bertanda hijau adalah pemisahan
    kewenangan — tiap peran punya berkas rutenya sendiri, sehingga data yang sama tampil berbeda
    tergantung siapa yang memintanya. Kotak putus-putus di kanan adalah sistem di luar kendali kami.
gambar:
- file: simbelmawa-1.png
  keterangan: Dasbor pengelola kementerian — rekap pengusulan lintas perguruan tinggi dalam angka
    agregat, tanpa data per mahasiswa.
- file: simbelmawa-2.png
  keterangan: Formulir pengusulan yang diisi mahasiswa, jalur utama yang paling ramai dipakai menjelang
    tenggat.
tantangan:
- Bagian tersulit bukan membangun fiturnya, melainkan menahan lonjakan menjelang tenggat. Pengusulan
  menumpuk di hari-hari terakhir, dan beban dari ratusan perguruan tinggi datang hampir bersamaan.
- 'Yang menyerah lebih dulu adalah <strong>basis datanya</strong>, bukan aplikasinya. Jalan keluar yang
  diambil saat itu adalah menaikkan spesifikasi server.'
- Menariknya, tidak ada keputusan rancangan yang akhirnya dibatalkan. Yang berubah hanya kapasitas
  mesinnya — bentuk sistemnya bertahan sejak versi pertama sampai sekarang.
belajar: 'Pelajaran yang paling terbawa ke proyek berikutnya: sistem yang sedang digantikan adalah dokumen
  kebutuhan paling jujur yang tersedia. Ia memuat aturan yang tidak pernah tertulis di mana pun, dan
  kebiasaan pengguna yang tidak akan disebutkan siapa pun dalam rapat karena sudah dianggap wajar.
  Membacanya lebih dulu lebih murah daripada menemukannya satu per satu setelah rilis.'
kerahasiaan: mahasiswa dan perguruan tinggi
