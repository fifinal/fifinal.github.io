urutan: 1
judul: Simbelmawa — Pengelolaan Hibah Kemahasiswaan Nasional
tahun: 2026
ringkas: API inti sistem pengelolaan hibah dan program kemahasiswaan Kementerian Pendidikan Tinggi, Sains,
  dan Teknologi, melayani delapan jenis pengguna dari mahasiswa hingga pengelola kementerian.
lead: Satu sistem yang harus melayani mahasiswa pengusul, dosen pendamping, reviewer, operator kampus,
  dan pengelola kementerian sekaligus — masing-masing dengan pandangan dan kewenangan yang berbeda.
peran: Pengembang Utama
periode: 2023 — Sekarang
tim: 5 kontributor
tipe: Freelance · Kementerian
tags:
- Laravel
- PHP
- PostgreSQL
- JWT
- Docker
live: null
status: Produksi — sistem nasional
masalah:
- '[ISI] Sebelum sistem ini ada, bagaimana pengajuan dan penilaian proposal hibah dijalankan? Apa yang
  paling sering macet?'
- Sistem pendahulunya berupa aplikasi web tunggal berbasis ASP.NET WebForms yang sudah berjalan sejak
  2018 — seluruh logika dan tampilannya menyatu, tanpa permukaan yang bisa dipanggil dari luar.
- 'Versi ini dirancang sebagai <strong>API tersendiri sejak awal</strong> — bukan sebagai tampalan atas
  permintaan yang datang belakangan. Rencananya sudah memperhitungkan lebih dari satu jenis pemanggil,
  termasuk aplikasi mobile Flutter yang kemudian dikerjakan tim lain.'
- 'Konsekuensinya menuntut kedisiplinan yang berbeda. Karena yang memakai API ini tim di luar tim saya,
  kontraknya harus jelas dan stabil sejak awal — tidak bisa diam-diam diubah lalu pemanggilnya
  disesuaikan belakangan.'
- '[ISI] Kendala apa yang khas ketika penggunanya tersebar di ratusan perguruan tinggi se-Indonesia?'
solusi:
- '[ISI] Keputusan arsitektur apa yang kamu ambil untuk menangani delapan peran pengguna sekaligus?'
- '[ISI] Bagaimana kamu memastikan setiap peran hanya bisa mengakses data yang menjadi haknya?'
proses:
- '[ISI] Bagaimana kebutuhan dikumpulkan — dari pihak kementerian langsung, atau lewat perantara?'
- '[ISI] Bagaimana siklus rilisnya, mengingat jadwalnya terikat agenda kegiatan nasional?'
- '[ISI] Bagian mana yang dikerjakan lebih dulu, dan kenapa?'
fitur:
- Pengelolaan program kemahasiswaan dan hibah, dari pengusulan hingga penetapan penerima
- Delapan peran pengguna dengan rute dan kewenangan terpisah — mahasiswa, dosen, reviewer, operator
  perguruan tinggi, pimpinan perguruan tinggi, pengelola LLDIKTI, admin kementerian, dan panitia PIMNAS
- Terhubung dengan Pangkalan Data Perguruan Tinggi untuk verifikasi data mahasiswa dan institusi
- Penugasan dan penilaian proposal oleh reviewer
- Basis pengetahuan berjenjang untuk pertanyaan yang sering diajukan, disusun per kategori dan tahapan
- Autentikasi berbasis token JWT dengan masa berlaku terkendali
- Berjalan dalam kontainer Docker dengan alur integrasi berkelanjutan
