urutan: 8
judul: UNISCO — Platform Kompetisi dan Ujian Daring
tahun: 2026
ringkas: Platform penyelenggaraan lomba dan olimpiade tingkat nasional, dari pendaftaran dan pembayaran
  sampai babak penyisihan — lewat ujian CBT untuk lomba akademik, dan lewat unggahan berkas untuk lomba
  non-akademik. Babak finalnya berlangsung luring, di luar sistem.
lead: 'Satu alur pendaftaran, dua jalur lomba yang tidak bisa disamakan — yang satu diadu lewat ujian
  serentak, yang lain lewat berkas yang diverifikasi panitia. Dan ujian daring tidak memberi kesempatan
  kedua: apa pun yang gagal saat itu tidak bisa diulang di hari lain.'
peran: Pengembang Utama
periode: Jun — Agu 2026
tim: 2 kontributor
tipe: Sistem internal kampus
tags:
- Laravel
- PHP 8.2
- Blade
- Tailwind
- Docker
live: https://unisco.umaha.ac.id
status: Produksi — sistem internal
fitur:
- Pendaftaran peserta perorangan maupun kelompok, dengan syarat lomba dan syarat peserta yang bisa diatur
- Pembayaran biaya pendaftaran dengan tarif berbeda per bidang lomba
- Bank soal dengan opsi jawaban, disusun per bidang lomba dan per tahapan
- Sesi ujian terjadwal untuk lomba akademik, dengan jawaban peserta tersimpan selama pengerjaan
- Jalur non-akademik lewat unggahan berkas persyaratan, diverifikasi panitia tanpa penilaian di sistem
- Penilaian dan pengumuman hasil babak penyisihan
- Halaman informasi lomba beserta pertanyaan yang sering diajukan
- Berjalan dalam kontainer Docker
metrik:
- angka: '85'
  keterangan: Commit atas nama saya — kontributor terbesar
- angka: '2'
  keterangan: Jalur lomba dari satu pendaftaran — akademik lewat CBT, non-akademik lewat berkas
- angka: 3 bulan
  keterangan: Dari commit pertama hingga penyelenggaraan
diagram:
  file: unisco.svg
  keterangan: Satu pendaftaran bercabang menjadi dua jalur yang diperlakukan berbeda, lalu keduanya
    bertemu lagi di babak final. Yang bertanda hijau adalah sesi ujiannya — satu-satunya bagian yang
    tidak bisa diulang kalau gagal, karena seluruh peserta mengerjakan pada jam yang sama. Kotak
    putus-putus di bawah adalah babak final yang berlangsung luring, di luar kendali sistem —
    sistemnya berhenti setelah penyisihan.
gambar:
- file: unisco-1.png
  keterangan: Dasbor panitia — jumlah peserta terdaftar, butir soal, dan sesi ujian yang sedang
    berjalan, berikut navigasi ke bank soal dan pemantauan langsung.
tantangan:
- '[ISI] Apa yang paling menegangkan saat hari pelaksanaan ujian? Adakah yang sempat bermasalah?'
- '[ISI] Adakah fitur yang dibangun lalu ternyata tidak terpakai saat acara?'
belajar: '[ISI] Satu pelajaran dari membangun sistem yang hanya dipakai beberapa jam, tapi tidak boleh
  gagal di jam-jam itu.'
