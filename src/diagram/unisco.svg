<!--
  Diagram alur UNISCO — digambar ulang pada tingkat abstraksi yang aman
  untuk portofolio publik. Tanpa nama peserta, isi soal, maupun
  topologi server.

  Bentuknya sengaja berbeda dari enam diagram sebelumnya: ini satu-
  satunya berbentuk hub — beberapa masukan menyatu ke satu titik, lalu
  memancar lagi menjadi keluaran. Titik tengahnya diberi aksen karena
  di situlah taruhannya: sesi ujian tidak bisa diulang.
-->
<svg viewBox="0 0 760 300" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Masukan menyatu ke satu sesi ujian, lalu memancar menjadi jawaban dan hasil</title>

  <defs>
    <marker id="un-panah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="dg-panah-ujung" d="M0,0 L10,5 L0,10 z" />
    </marker>
  </defs>

  <!-- Masukan menyatu -->
  <g class="dg-cabang">
    <path d="M206,56  C240,56  240,144 270,144" marker-end="url(#un-panah)" />
    <path d="M206,144 C240,144 240,144 270,144" marker-end="url(#un-panah)" />
    <path d="M206,232 C240,232 240,144 270,144" marker-end="url(#un-panah)" />
  </g>

  <!-- Keluaran memancar -->
  <g class="dg-cabang">
    <path d="M480,144 C512,144 512,108 546,108" marker-end="url(#un-panah)" />
    <path d="M480,144 C512,144 512,204 546,204" marker-end="url(#un-panah)" />
  </g>

  <g class="dg-kotak">
    <rect x="16"  y="24"  width="190" height="64" rx="10" />
    <rect x="16"  y="112" width="190" height="64" rx="10" />
    <rect x="16"  y="200" width="190" height="64" rx="10" />
    <rect x="546" y="76"  width="198" height="64" rx="10" />
    <rect x="546" y="172" width="198" height="64" rx="10" />
  </g>

  <!-- Satu-satunya yang beraksen: jam yang tidak bisa diulang -->
  <rect class="dg-kotak-aksen" x="270" y="94" width="210" height="100" rx="10" />

  <g class="dg-judul">
    <text x="36"  y="52">Pendaftaran</text>
    <text x="36"  y="140">Bank soal</text>
    <text x="36"  y="228">Jadwal sesi</text>
    <text x="290" y="138" class="dg-teks-aksen">Sesi ujian</text>
    <text x="566" y="104">Jawaban peserta</text>
    <text x="566" y="200">Hasil dan peringkat</text>
  </g>

  <g class="dg-sub">
    <text x="36"  y="72">beserta pembayaran biaya</text>
    <text x="36"  y="160">per bidang dan tahapan</text>
    <text x="36"  y="248">waktu dan kuota per sesi</text>
    <text x="290" y="158" class="dg-sub-aksen">peserta mengerjakan serentak</text>
    <text x="566" y="124">tersimpan selama pengerjaan</text>
    <text x="566" y="220">penilaian dan pengumuman</text>
  </g>
</svg>
