<!--
  Diagram alur MTQMN — digambar ulang pada tingkat abstraksi yang aman
  untuk portofolio publik. Tanpa nama perguruan tinggi, nama tabel,
  maupun isi penilaian.

  Bentuknya lajur yang bermuara: banyak cabang lomba dengan aturannya
  masing-masing menyatu ke satu mekanisme penilaian. Yang diberi aksen
  bukan mesin penilaiannya, melainkan lapisan aturannya — karena di
  situlah inti persoalannya: perbedaan antarcabang disimpan sebagai
  data, bukan sebagai percabangan kode.
-->
<svg viewBox="0 0 760 340" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Banyak cabang lomba bermuara ke satu mekanisme penilaian lewat lapisan aturan per cabang</title>

  <defs>
    <marker id="mt-panah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="dg-panah-ujung" d="M0,0 L10,5 L0,10 z" />
    </marker>
  </defs>

  <!-- Perguruan tinggi menyetor peserta ke tiap cabang -->
  <g class="dg-cabang">
    <path d="M150,60  L186,60" />
    <path d="M150,148 L186,148" />
    <path d="M150,236 L186,236" />
  </g>

  <!-- Lajur cabang menyatu ke lapisan aturan, lalu ke penilaian -->
  <g class="dg-alur">
    <path d="M356,60  C386,60  386,148 416,148" marker-end="url(#mt-panah)" />
    <line x1="356" y1="148" x2="416" y2="148" marker-end="url(#mt-panah)" />
    <path d="M356,236 C386,236 386,148 416,148" marker-end="url(#mt-panah)" />
    <line x1="596" y1="148" x2="632" y2="148" marker-end="url(#mt-panah)" />
    <line x1="694" y1="212" x2="694" y2="248" marker-end="url(#mt-panah)" />
  </g>

  <!-- Penyetor peserta, di luar kendali sistem -->
  <g class="dg-cip">
    <rect x="16" y="118" width="134" height="60" rx="8" />
  </g>

  <!-- Lajur tiap cabang lomba -->
  <g class="dg-kotak">
    <rect x="186" y="28"  width="170" height="64" rx="10" />
    <rect x="186" y="116" width="170" height="64" rx="10" />
    <rect x="186" y="204" width="170" height="64" rx="10" />
  </g>

  <!-- Satu-satunya yang beraksen: aturan yang berbeda tiap cabang -->
  <rect class="dg-kotak-aksen" x="416" y="104" width="180" height="88" rx="10" />

  <!-- Mekanisme penilaian dan keluarannya -->
  <g class="dg-kotak">
    <rect x="632" y="112" width="112" height="72" rx="10" />
    <rect x="632" y="248" width="112" height="64" rx="10" />
  </g>

  <g class="dg-cip-teks">
    <text x="30" y="145">Perguruan tinggi</text>
    <text x="30" y="163">penyetor peserta</text>
  </g>

  <g class="dg-judul">
    <text x="204" y="54">Cabang lomba A</text>
    <text x="204" y="142">Cabang lomba B</text>
    <text x="204" y="230">Cabang lomba C · dst.</text>
    <text x="436" y="140" class="dg-teks-aksen">Aturan per cabang</text>
    <text x="650" y="142">Penilaian juri</text>
    <text x="650" y="278">Hasil</text>
  </g>

  <g class="dg-sub">
    <text x="204" y="74">kelompok peserta &amp; karyanya</text>
    <text x="204" y="162">kelompok peserta &amp; karyanya</text>
    <text x="204" y="250">kelompok peserta &amp; karyanya</text>
    <text x="436" y="160" class="dg-sub-aksen">syarat berkas · babak · bobot,</text>
    <text x="436" y="178" class="dg-sub-aksen">disimpan sebagai data</text>
    <text x="650" y="160">bertahap</text>
    <text x="650" y="296">&amp; pelaporan</text>
  </g>
</svg>
