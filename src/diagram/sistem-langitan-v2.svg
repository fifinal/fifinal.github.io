<!--
  Diagram arsitektur Sistem Langitan v2 — digambar ulang pada tingkat
  abstraksi yang aman untuk portofolio publik. Tanpa nama tabel, nama
  kelas, endpoint, maupun topologi server.

  Bentuknya sengaja berbeda dari empat diagram sebelumnya: di sini yang
  menarik adalah dua permukaan yang menyatu ke satu lapisan layanan,
  lalu bertumpu pada basis data warisan yang tidak sendirian dipakai.

  Yang diberi aksen adalah basis datanya, bukan lapisan layanannya:
  lapisan layanan adalah solusinya, basis data warisan adalah kendala
  yang membentuk seluruh keputusan lain.
-->
<svg viewBox="0 0 760 430" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Dua permukaan menyatu ke satu lapisan layanan di atas basis data warisan yang dipakai bersama sistem lama</title>

  <defs>
    <marker id="v2-panah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="dg-panah-ujung" d="M0,0 L10,5 L0,10 z" />
    </marker>
  </defs>

  <!-- Dua permukaan menyatu ke satu lapisan layanan -->
  <g class="dg-cabang">
    <path d="M182,82 C182,112 290,110 290,140" />
    <path d="M397,82 C397,112 290,110 290,140" />
  </g>

  <!-- Tulang punggung -->
  <g class="dg-alur">
    <line x1="290" y1="204" x2="290" y2="236" marker-end="url(#v2-panah)" />
    <line x1="290" y1="294" x2="290" y2="326" marker-end="url(#v2-panah)" />
    <!-- sistem lama ikut memakai basis data yang sama -->
    <line x1="550" y1="358" x2="490" y2="358" marker-end="url(#v2-panah)" />
  </g>

  <!-- Dua permukaan setara -->
  <g class="dg-kotak">
    <rect x="90"  y="24" width="185" height="58" rx="10" />
    <rect x="305" y="24" width="185" height="58" rx="10" />
    <rect x="90"  y="140" width="400" height="64" rx="10" />
    <rect x="90"  y="236" width="400" height="58" rx="10" />
  </g>

  <!-- Kendala yang membentuk seluruh keputusan lain -->
  <rect class="dg-kotak-aksen" x="90" y="326" width="400" height="64" rx="10" />

  <!-- Sistem lama, di luar kendali penulisan ulang ini -->
  <g class="dg-cip">
    <rect x="550" y="326" width="190" height="64" rx="10" />
  </g>

  <g class="dg-judul">
    <text x="110" y="48">Halaman web</text>
    <text x="325" y="48">Klien mobile</text>
    <text x="110" y="166">Lapisan layanan bersama</text>
    <text x="110" y="262">Empat belas peran</text>
    <text x="110" y="352" class="dg-teks-aksen">Basis data warisan</text>
    <text x="570" y="352" class="dg-judul-luar">Sistem lama</text>
  </g>

  <g class="dg-sub">
    <text x="110" y="68">Inertia + Vue 3 · sesi</text>
    <text x="325" y="68">API JSON berversi · JWT</text>
    <text x="110" y="186">satu logika untuk dua permukaan</text>
    <text x="110" y="282">rute dan kewenangan terpisah</text>
    <text x="110" y="372" class="dg-sub-aksen">Oracle · skema tidak boleh diubah</text>
    <text x="570" y="372">masih melayani produksi</text>
  </g>
</svg>
